[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalcore"
version = "0.1.0"
description = "Universal, project-agnostic evaluation framework for LLM systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maks" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anyio>=4.4",
    "jsonpath-ng>=1.6",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.0",
]

# NOTE (M6): plugin-discovery entry points `evalcore.metrics` / `evalcore.adapters`
# and the `evalcore` console script are added in M6, when a second consumer needs
# them. See AGENTS.md "framework disease" rule — no abstraction until two consumers.

[tool.hatch.build.targets.wheel]
packages = ["evalcore"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
