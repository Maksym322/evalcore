services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ticketpilot
      POSTGRES_PASSWORD: ticketpilot
      POSTGRES_DB: ticketpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://ticketpilot:ticketpilot@db:5432/ticketpilot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
