services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ticketpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketpilot_dev_only}
      POSTGRES_DB: ticketpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketpilot -d ticketpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://ticketpilot:${POSTGRES_PASSWORD:-ticketpilot_dev_only}@db:5432/ticketpilot
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://ticketpilot:${POSTGRES_PASSWORD:-ticketpilot_dev_only}@db:5432/ticketpilot
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      API_TOKEN: ${API_TOKEN:-}
      EVAL_TOKEN: ${EVAL_TOKEN:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      ACTIVE_EMBED_MODEL: ${ACTIVE_EMBED_MODEL:-gemini-embedding-2}
    ports:
      - "127.0.0.1:${TICKETPILOT_PORT:-18000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
